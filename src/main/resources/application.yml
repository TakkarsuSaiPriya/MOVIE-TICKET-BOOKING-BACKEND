server:
  port: 8081

spring:
  application:
    name: movie-ticket-booking

  datasource:
    url: jdbc:mysql://localhost:3306/movie_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "ThisIsASecretKeyForMovieTicketBookingApplicationMustBe256BitsLong"
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

  seat-lock:
    hold-duration-minutes: 5
    cleanup-cron: "0 */1 * * * *"

logging:
  level:
    root: INFO
    com.movieticket.booking: DEBUG
